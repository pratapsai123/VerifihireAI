version: '3.8'

services:

  nginx:
    image: public.ecr.aws/docker/library/nginx:1.25-alpine
    container_name: verifyhire_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./admin-build:/usr/share/nginx/admin
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./frontend/build:/usr/share/nginx/html
      - verifihireai_media:/app/media
    depends_on:
      - redis
    restart: unless-stopped
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    container_name: verifyhire_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: verifyhire_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  executor:
    build:
      context: ./executor
    container_name: verifyhire_executor
    restart: unless-stopped

    environment:
      EXECUTOR_PORT: "4000"
      DEFAULT_TIME_LIMIT_MS: "3000"
      DEFAULT_MEMORY_MB: "256"
      DOCKER_HOST: tcp://dind:2375
      DOCKER_TLS_VERIFY: "0"
    ports:
      - "4001:4000"
    depends_on:
      - dind

  dind:
    image: docker:24-dind
    container_name: verifyhire_dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind_data:/var/lib/docker

  # backend:
  #   build: ./backend
  #   working_dir: /app
  #   container_name: verifyhire_backend
  #   command: daphne -b 0.0.0.0 -p 8001 VerifiHireAI_backend.asgi:application
  #   volumes:
  #     - ./backend:/app
  #   ports:
  #     - "8001:8001"
  #   env_file:
  #     - ./frontend/.env   # 👈 moved here

volumes:
  verifihireai_media:
  dind_data: