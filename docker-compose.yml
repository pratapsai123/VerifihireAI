services:


  executor:
    build:
      context: ./executor
    container_name: VrrifiHire_executor
    restart: unless-stopped
    environment:
      EXECUTOR_PORT: "4000"
      DEFAULT_TIME_LIMIT_MS: "3000"
      DEFAULT_MEMORY_MB: "256"
      DOCKER_HOST: tcp://dind:2375
      DOCKER_TLS_VERIFY: "0"
    ports:
      - "4000:4000"
    depends_on:
      - dind

  dind:
    image: public.ecr.aws/docker/library/docker:24-dind
    container_name: VrrifiHire_dind
    privileged: true
    restart: unless-stopped

    environment:
      DOCKER_TLS_CERTDIR: ""
    # command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]

volumes:
  verifihireai_media: