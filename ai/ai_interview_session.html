<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Session | VeriFiHireAI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .session-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
        }

        .session-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 2rem;
            color: white;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .session-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(60px);
        }

        .session-header h1 {
            font-size: 1.8rem;
            margin: 0 0 0.5rem 0;
            position: relative;
            z-index: 1;
        }

        .session-info {
            display: flex;
            gap: 2rem;
            font-size: 0.95rem;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.2);
            height: 6px;
            border-radius: 10px;
            margin-top: 1rem;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .progress-fill {
            background: white;
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .chat-container {
            flex: 1;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            overflow-y: auto;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.ai {
            flex-direction: row;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .message-content {
            flex: 1;
            max-width: 70%;
        }

        .message-bubble {
            padding: 1.25rem 1.5rem;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 0.98rem;
        }

        .message.ai .message-bubble {
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
            border: 1px solid rgba(102, 126, 234, 0.1);
            color: var(--text-primary);
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: right;
        }

        .message-time {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 0.5rem;
        }

        .typing-indicator {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
            border-radius: 16px;
            width: fit-content;
            border: 1px solid rgba(102, 126, 234, 0.1);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.7;
            }

            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .input-container {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
        }

        .response-input {
            width: 100%;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
            max-height: 150px;
            transition: all 0.3s ease;
        }

        .response-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .completion-screen {
            text-align: center;
            padding: 3rem 2rem;
        }

        .completion-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .completion-screen h2 {
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .completion-screen p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>

<body>
    <div class="dashboard-page">
        <nav class="sidebar">
            <div class="logo">VeriFiHireAI</div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="ai_adventure.html"><i class="fa-solid fa-robot"></i> AI Adventure</a></li>
                <li><a href="candidates.html"><i class="fa-solid fa-users"></i> Candidates</a></li>
                <li><a href="assessments.html"><i class="fa-solid fa-clipboard-list"></i> Assessments</a></li>
                <li class="active"><a href="ai_interview.html"><i class="fa-solid fa-microphone"></i> AI Interview</a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h1 style="font-size: 2rem; margin: 0;">Live Interview Session</h1>
                    <p style="margin: 0.5rem 0 0 0;">AI-powered candidate assessment in progress</p>
                </div>
                <div class="user-profile">
                    <div class="notification-icon"><i class="fa-regular fa-bell"></i></div>
                    <div class="avatar">HR</div>
                </div>
            </header>

            <div class="session-container">
                <div class="session-header">
                    <h1><i class="fa-solid fa-robot"></i> AI Interview Session</h1>
                    <div class="session-info">
                        <div><i class="fa-solid fa-user"></i> <span id="candidateName">Loading...</span></div>
                        <div><i class="fa-solid fa-layer-group"></i> Question <span id="currentQuestion">1</span>/<span
                                id="totalQuestions">5</span></div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                </div>

                <div class="chat-container" id="chatContainer">
                    <!-- Messages will be added here dynamically -->
                </div>

                <div class="input-container" id="inputContainer">
                    <div class="input-wrapper">
                        <textarea id="responseInput" class="response-input" placeholder="Type your answer here..."
                            rows="2"></textarea>
                    </div>
                    <button class="submit-btn" id="submitBtn" onclick="submitResponse()">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Send</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Interview state
        let candidateData = null;
        let currentQuestionIndex = 0;
        let questions = [];
        let responses = [];
        let isProcessing = false;

        // Sample questions based on common resume sections
        const questionTemplates = [
            "Can you walk me through your experience with {skill} and how you've applied it in your previous roles?",
            "Tell me about a challenging project you worked on related to {skill}. What was your approach and what did you learn?",
            "How do you stay updated with the latest trends and best practices in {field}?",
            "Describe a situation where you had to collaborate with a team to solve a complex problem. What was your role?",
            "What motivates you professionally, and what are your career goals for the next 2-3 years?"
        ];

        // Polite acknowledgements
        const acknowledgements = [
            "Thank you for sharing that.",
            "That's a great example.",
            "I appreciate your detailed response.",
            "Interesting perspective.",
            "Good to know.",
            "That's very insightful.",
            "Thanks for elaborating on that.",
            "I see, that makes sense."
        ];

        // Initialize session
        function initSession() {
            // Get candidate data from sessionStorage
            const storedData = sessionStorage.getItem('interviewData');

            if (!storedData) {
                alert('No interview data found. Redirecting to start page...');
                window.location.href = 'ai_interview.html';
                return;
            }

            candidateData = JSON.parse(storedData);
            document.getElementById('candidateName').textContent = candidateData.name;

            // Generate questions (simulated AI analysis)
            generateQuestions();

            // Show welcome message
            setTimeout(() => {
                addMessage('ai', `Hello ${candidateData.name}! 👋 I'm your AI interviewer. I've analyzed your resume and prepared some questions to better understand your experience and skills. Let's begin!`);
                setTimeout(() => askNextQuestion(), 1500);
            }, 500);
        }

        function generateQuestions() {
            // Simulated AI question generation based on "resume analysis"
            const skills = ['JavaScript', 'Python', 'React', 'problem-solving', 'your field'];
            const fields = ['software development', 'data analysis', 'web development', 'your industry'];

            questions = [
                questionTemplates[0].replace('{skill}', skills[Math.floor(Math.random() * skills.length)]),
                questionTemplates[1].replace('{skill}', skills[Math.floor(Math.random() * skills.length)]),
                questionTemplates[2].replace('{field}', fields[Math.floor(Math.random() * fields.length)]),
                questionTemplates[3],
                questionTemplates[4]
            ];

            document.getElementById('totalQuestions').textContent = questions.length;
        }

        function addMessage(type, content) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            messageDiv.innerHTML = `
                <div class="message-avatar">
                    <i class="fa-solid fa-${type === 'ai' ? 'robot' : 'user'}"></i>
                </div>
                <div class="message-content">
                    <div class="message-bubble">${content}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const chatContainer = document.getElementById('chatContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="message-avatar">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function askNextQuestion() {
            if (currentQuestionIndex >= questions.length) {
                completeInterview();
                return;
            }

            showTypingIndicator();

            setTimeout(() => {
                hideTypingIndicator();
                addMessage('ai', questions[currentQuestionIndex]);
                document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
                updateProgress();

                // Re-enable input after question is asked
                document.getElementById('responseInput').disabled = false;
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('responseInput').focus();
                isProcessing = false;
            }, 1500);
        }

        // Contextual acknowledgements
        const shortAnswerResponses = [
            "Could you elaborate a bit more on that?",
            "That's interesting. Can you provide more details?",
            "I'd love to hear more specific examples if you have them.",
            "Could you walk me through the details of that?",
            "Please tell me more about that specific experience."
        ];

        const positiveAcknowledgements = [
            "That sounds like a valuable experience.",
            "It's impressive how you handled that.",
            "That's a very proactive approach.",
            "I appreciate the depth of your answer.",
            "That aligns well with what we're looking for.",
            "Thank you for sharing those specific details."
        ];

        // ... (initSession, generateQuestions, addMessage, showTypingIndicator, hideTypingIndicator, askNextQuestion remain same)

        function submitResponse() {
            const input = document.getElementById('responseInput');
            const response = input.value.trim();

            if (!response) {
                input.focus();
                return;
            }

            if (isProcessing) return;
            isProcessing = true;

            // Disable input
            input.disabled = true;
            document.getElementById('submitBtn').disabled = true;

            // Add user message
            addMessage('user', response);
            responses.push({
                question: questions[currentQuestionIndex],
                answer: response,
                timestamp: new Date().toISOString()
            });

            // Clear input
            input.value = '';

            // Smart Analysis Logic
            setTimeout(() => {
                showTypingIndicator();

                setTimeout(() => {
                    hideTypingIndicator();

                    // Analyze response length and content
                    const wordCount = response.split(' ').length;
                    let nextActionDelay = 1500;

                    // Case 1: Answer is too short (less than 5 words)
                    if (wordCount < 5) {
                        const probe = shortAnswerResponses[Math.floor(Math.random() * shortAnswerResponses.length)];
                        addMessage('ai', probe);

                        // Re-enable input for elaboration WITHOUT moving to next question
                        input.disabled = false;
                        document.getElementById('submitBtn').disabled = false;
                        input.focus();
                        isProcessing = false;
                        return; // Stop here, wait for user to elaborate
                    }

                    // Case 2: Good length answer - Provide acknowledgement then move on
                    const ack = positiveAcknowledgements[Math.floor(Math.random() * positiveAcknowledgements.length)];
                    addMessage('ai', ack);

                    // Move to next question
                    currentQuestionIndex++;

                    setTimeout(() => {
                        askNextQuestion();
                    }, nextActionDelay);

                }, 1000 + Math.random() * 1000); // Random "thinking" time 1-2s
            }, 500);
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex) / questions.length) * 100; // Updated progress calculation
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function completeInterview() {
            // Store interview results
            const results = {
                candidate: candidateData,
                questions: questions,
                responses: responses,
                completedAt: new Date().toISOString()
            };

            sessionStorage.setItem('interviewResults', JSON.stringify(results));

            // Hide input container
            document.getElementById('inputContainer').style.display = 'none';

            // Show completion message
            setTimeout(() => {
                const chatContainer = document.getElementById('chatContainer');

                // Add final closing message from AI
                showTypingIndicator();
                setTimeout(() => {
                    hideTypingIndicator();
                    addMessage('ai', "Thank you for your time today. I've gathered all the information I need.");

                    setTimeout(() => {
                        chatContainer.innerHTML = `
                            <div class="completion-screen">
                                <div class="completion-icon">
                                    <i class="fa-solid fa-check"></i>
                                </div>
                                <h2>Interview Complete!</h2>
                                <p>Thank you for completing the AI interview, ${candidateData.name}.<br>
                                Your responses have been recorded and will be reviewed by our hiring team.<br>
                                We'll be in touch soon with the next steps.</p>
                                <button class="back-btn" onclick="window.location.href='ai_interview.html'">
                                    <i class="fa-solid fa-arrow-left"></i> Start New Interview
                                </button>
                            </div>
                        `;
                    }, 1500);
                }, 1000);

            }, 500);
        }

        // Handle Enter key in textarea
        document.addEventListener('DOMContentLoaded', () => {
            initSession();

            const input = document.getElementById('responseInput');
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    submitResponse();
                }
            });
        });
    </script>
</body>

</html>
