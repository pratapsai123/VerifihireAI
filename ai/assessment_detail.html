<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Details | VeriFiHireAI</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .detail-card {
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 2rem;
        }

        .question-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .question-text {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 1rem;
        }

        .option-list {
            list-style: none;
            padding: 0;
        }

        .option-item {
            padding: 0.5rem 1rem;
            margin-bottom: 0.5rem;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }

        .option-item.correct {
            border-color: #22c55e;
            background-color: #f0fdf4;
            color: #15803d;
        }

        .code-block {
            background: #0f172a;
            color: #f8fafc;
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            overflow-x: auto;
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="dashboard-page">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="logo">VeriFiHireAI</div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="ai_adventure.html"><i class="fa-solid fa-robot"></i> AI Adventure</a></li>
                <li><a href="candidates.html"><i class="fa-solid fa-users"></i> Candidates</a></li>
                <li class="active"><a href="assessments.html"><i class="fa-solid fa-clipboard-list"></i> Assessments</a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h1>Assessment Details</h1>
                    <p id="assessmentDate">Loading...</p>
                </div>
                <div class="user-profile">
                    <a href="assessments.html" class="auth-secondary-btn"
                        style="margin-right: 1rem; text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px;">Back
                        to List</a>
                    <div class="avatar">HR</div>
                </div>
            </header>

            <div class="dashboard-container">
                <!-- Overview Section -->
                <div class="detail-card">
                    <h2 style="margin-bottom: 1rem;">Overview</h2>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem;">
                        <div>
                            <small style="color: #64748b;">Job Role</small>
                            <p id="jobRole" style="font-weight: 500; font-size: 1.1rem;"></p>
                        </div>
                        <div>
                            <small style="color: #64748b;">Required Skills</small>
                            <p id="skills" style="font-weight: 500; font-size: 1.1rem;"></p>
                        </div>
                        <div>
                            <small style="color: #64748b;">Duration</small>
                            <p id="duration" style="font-weight: 500; font-size: 1.1rem;"></p>
                        </div>
                    </div>
                </div>

                <!-- MCQs Section -->
                <section>
                    <h2 class="section-heading">Multiple Choice Questions</h2>
                    <div id="mcqContainer">
                        <!-- Populated by JS -->
                        <p>Loading questions...</p>
                    </div>
                </section>

                <!-- Coding Challenges Section -->
                <section>
                    <h2 class="section-heading">Coding Challenges</h2>
                    <div id="codingContainer">
                        <!-- Populated by JS -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                alert('No assessment ID provided.');
                window.location.href = 'assessments.html';
                return;
            }

            try {
                const response = await fetch(`http://localhost:8001/api/assessments/${id}/`);
                if (!response.ok) throw new Error('Failed to fetch assessment details');

                const data = await response.json();
                renderAssessment(data);

            } catch (error) {
                console.error('Error:', error);
                document.querySelector('.dashboard-container').innerHTML = `<h3 style="color: red; text-align: center;">Error loading assessment: ${error.message}</h3>`;
            }
        });

        function renderAssessment(data) {
            // Header
            document.getElementById('assessmentDate').textContent = `Created on: ${data.created_at}`;
            document.getElementById('jobRole').textContent = data.job_description.substring(0, 50) + (data.job_description.length > 50 ? '...' : '');
            document.getElementById('skills').textContent = data.required_skills;
            document.getElementById('duration').textContent = `${data.duration_minutes} Mins`;

            const content = data.generated_content;
            if (!content) {
                document.getElementById('mcqContainer').innerHTML = '<p>No content generated for this assessment.</p>';
                return;
            }

            // MCQs
            const mcqContainer = document.getElementById('mcqContainer');
            mcqContainer.innerHTML = '';
            if (content.mcqs && content.mcqs.length > 0) {
                content.mcqs.forEach((q, index) => {
                    const card = document.createElement('div');
                    card.className = 'question-card';

                    let optionsHtml = '';
                    q.options.forEach(opt => {
                        const isCorrect = opt === q.answer;
                        optionsHtml += `<li class="option-item ${isCorrect ? 'correct' : ''}">
                            ${isCorrect ? '<i class="fa-solid fa-check-circle" style="margin-right: 8px;"></i>' : '<i class="fa-regular fa-circle" style="margin-right: 8px;"></i>'}
                            ${opt}
                        </li>`;
                    });

                    card.innerHTML = `
                        <div class="question-text">Q${index + 1}. ${q.question}</div>
                        <ul class="option-list">${optionsHtml}</ul>
                    `;
                    mcqContainer.appendChild(card);
                });
            } else {
                mcqContainer.innerHTML = '<p>No MCQs found.</p>';
            }

            // Coding Challenges
            const codingContainer = document.getElementById('codingContainer');
            codingContainer.innerHTML = '';
            if (content.coding_challenges && content.coding_challenges.length > 0) {
                content.coding_challenges.forEach((c, index) => {
                    const card = document.createElement('div');
                    card.className = 'question-card';
                    card.innerHTML = `
                        <div class="question-text">Challenge ${index + 1}: ${c.title}</div>
                        <p>${c.problem}</p>
                        <div style="margin-top: 1rem;">
                            <strong>Example:</strong>
                            <div class="code-block">${c.example || 'No example provided'}</div>
                        </div>
                    `;
                    codingContainer.appendChild(card);
                });
            } else {
                codingContainer.innerHTML = '<p>No coding challenges found.</p>';
            }
        }
    </script>
</body>

</html>
