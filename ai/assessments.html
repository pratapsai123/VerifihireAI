<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessments | VeriFiHireAI</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="dashboard-page">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="logo">VeriFiHireAI</div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="ai_adventure.html"><i class="fa-solid fa-robot"></i> AI Adventure</a></li>
                <li><a href="candidates.html"><i class="fa-solid fa-users"></i> Candidates</a></li>
                <li class="active"><a href="#"><i class="fa-solid fa-clipboard-list"></i> Assessments</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h1>Assessments</h1>
                    <p>Manage scheduled and ongoing candidate assessments.</p>
                </div>
                <div class="user-profile">
                    <div class="notification-icon"><i class="fa-regular fa-bell"></i></div>
                    <div class="avatar">HR</div>
                </div>
            </header>

            <div class="dashboard-container">
                <!-- Ongoing Assessments Section -->
                <section class="recent-section" style="margin-bottom: 2rem;">
                    <h2 class="section-heading"
                        style="display: flex; align-items: center; justify-content: space-between;">
                        Ongoing Assessments
                        <span class="status-badge status-review" style="font-size: 0.8rem;">2 Active</span>
                    </h2>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Candidate</th>
                                    <th>Assessment Type</th>
                                    <th>Progress</th>
                                    <th>Time Remaining</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="assessmentsTableBody">
                                <!-- Data will be populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Scheduled Assessments Section (Hidden for now as we focus on AI Generated) -->
                <!-- <section class="recent-section"> ... </section> -->
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tableBody = document.getElementById('assessmentsTableBody');

            try {
                // Use absolute URL to support local file opening/Live Server
                const response = await fetch('http://localhost:8001/api/assessments/');
                if (!response.ok) throw new Error(`Failed to fetch assessments: ${response.status} ${response.statusText}`);

                const assessments = await response.json();

                if (assessments.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No assessments generated yet.</td></tr>';
                    return;
                }

                tableBody.innerHTML = assessments.map(assessment => `
                    <tr>
                        <td>
                            <div class="candidate-info">
                                <div class="candidate-avatar">AI</div>
                                <span>${assessment.job_description ? assessment.job_description.substring(0, 30) : 'No Description'}...</span>
                            </div>
                        </td>
                        <td>${assessment.required_skills}</td>
                        <td>
                            <span class="status-badge status-new">Generated</span>
                        </td>
                        <td>${assessment.duration_minutes} mins</td>
                        <td>
                            <button class="action-btn" onclick="viewAssessment(${assessment.id})">View Details</button>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error('Error:', error);
                tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">
                    Error loading assessments: ${error.message}<br>
                    <small>Ensure Backend is running on port 8001 and you are connected.</small>
                </td></tr>`;
            }
        });

        function viewAssessment(id) {
            alert("View details feature coming soon for ID: " + id);
        }
    </script>
</body>

</html>
