<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Team | VeriFiHireAI</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="header-section">
                    <h1 class="auth-title">Join Our Team</h1>
                    <p class="auth-subtitle">Upload your resume and details to apply for a position.</p>
                </div>

                <form id="jobApplicationForm" class="auth-form">
                    <div class="auth-grid">
                        <!-- Left Column: Personal Info -->
                        <div class="auth-column">
                            <h3 class="auth-column-title">Personal Details</h3>

                            <div class="auth-input-icon-wrapper">
                                <div class="auth-input-icon"><i class="fa-regular fa-user"></i></div>
                                <input type="text" id="fullName" name="fullName" class="auth-input-with-icon"
                                    placeholder=" " required>
                                <label for="fullName" class="auth-floating-label">Full Name</label>
                            </div>

                            <div class="auth-input-icon-wrapper">
                                <div class="auth-input-icon"><i class="fa-regular fa-envelope"></i></div>
                                <input type="email" id="email" name="email" class="auth-input-with-icon" placeholder=" "
                                    required>
                                <label for="email" class="auth-floating-label">Email Address</label>
                            </div>

                            <div class="auth-input-icon-wrapper">
                                <div class="auth-input-icon"><i class="fa-solid fa-phone"></i></div>
                                <input type="tel" id="phone" name="phone" class="auth-input-with-icon" placeholder=" "
                                    required>
                                <label for="phone" class="auth-floating-label">Phone Number</label>
                            </div>

                            <div class="auth-input-icon-wrapper">
                                <div class="auth-input-icon"><i class="fa-brands fa-linkedin"></i></div>
                                <input type="url" id="linkedin" name="linkedin" class="auth-input-with-icon"
                                    placeholder=" ">
                                <label for="linkedin" class="auth-floating-label">LinkedIn Profile (Optional)</label>
                            </div>
                        </div>

                        <!-- Right Column: Professional Info & Upload -->
                        <div class="auth-column auth-column-secondary">
                            <h3 class="auth-column-title">Professional Info</h3>

                            <div class="auth-input-icon-wrapper">
                                <div class="auth-input-icon"><i class="fa-solid fa-briefcase"></i></div>
                                <input type="text" id="jobTitle" name="jobTitle" class="auth-input-with-icon"
                                    placeholder=" " required>
                                <label for="jobTitle" class="auth-floating-label">Current Job Title</label>
                            </div>

                            <div class="file-upload-container">
                                <label class="file-upload-label">Resume / CV</label>
                                <div class="file-upload-box" id="dropZone">
                                    <input type="file" id="resume" name="resume" class="file-input"
                                        accept=".pdf,.doc,.docx" required hidden>
                                    <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                                    <p class="upload-text">Drag & drop or <span class="browse-link">browse</span></p>
                                    <p class="file-name" id="fileName"></p>
                                </div>
                            </div>

                            <div class="auth-input-icon-wrapper" style="margin-top: 1rem;">
                                <textarea id="coverLetter" name="coverLetter" class="auth-input-with-icon"
                                    placeholder=" " rows="3" style="resize: none; height: auto;"></textarea>
                                <label for="coverLetter" class="auth-floating-label" style="top: 1.5rem;">Cover Letter
                                    (Optional)</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions"
                        style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
                        <button type="submit" class="auth-primary-btn">Submit Application</button>
                        <a href="ai_adventure.html"
                            style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">Go to AI
                            Dashboard <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
