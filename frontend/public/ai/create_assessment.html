<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Smart Assessment | VeriFiHireAI</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4318FF;
            --secondary: #7551FF;
            --bg-glass: rgba(255, 255, 255, 0.9);
            --text-main: #2B3674;
            --text-sec: #A3AED0;
        }

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #F4F7FE 0%, #E2E8F0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 3.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header {
            margin-bottom: 3rem;
        }

        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
            color: #1B254B;
        }

        .header p {
            color: var(--text-sec);
            font-size: 1.1rem;
            margin: 0;
        }

        .form-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .form-group i {
            position: absolute;
            left: 1.2rem;
            top: 1.1rem;
            color: var(--text-sec);
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .form-group textarea i {
            top: 1.4rem;
        }

        .form-control {
            width: 100%;
            padding: 1.1rem 1rem 1.1rem 3.5rem;
            border: 2px solid #E0E5F2;
            border-radius: 18px;
            font-size: 1rem;
            font-weight: 500;
            background: #F4F7FE;
            color: #1B254B;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 10px 20px rgba(67, 24, 255, 0.05);
        }

        .form-control:focus~i {
            color: var(--primary);
        }

        .form-label {
            position: absolute;
            left: 3.5rem;
            top: 1.1rem;
            color: var(--text-sec);
            pointer-events: none;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .form-control:focus~.form-label,
        .form-control:not(:placeholder-shown)~.form-label {
            top: -0.8rem;
            left: 1.2rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
            background: white;
            padding: 0 0.5rem;
            border-radius: 4px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 1.2rem;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 15px 30px rgba(67, 24, 255, 0.2);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .btn-generate:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(67, 24, 255, 0.3);
        }

        .btn-generate:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        @media (max-width: 600px) {
            .config-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Create Smart Assessment</h1>
                <p>Define the role and let AI craft the perfect test.</p>
            </div>

            <form id="assessmentForm">
                <!-- Job Description -->
                <div class="form-group">
                    <textarea id="jobDescription" class="form-control" required placeholder=" "></textarea>
                    <i class="fa-solid fa-file-lines"></i>
                    <label for="jobDescription" class="form-label">Job Description / Role Requirements</label>
                </div>

                <!-- Skills -->
                <div class="form-group">
                    <input type="text" id="requiredSkills" class="form-control" required placeholder=" ">
                    <i class="fa-solid fa-tags"></i>
                    <label for="requiredSkills" class="form-label">Required Skills (e.g., Python, React, AWS)</label>
                </div>

                <!-- Configuration Grid -->
                <div class="config-grid">
                    <!-- MCQ Count -->
                    <div class="form-group">
                        <input type="number" id="mcqCount" class="form-control" min="1" max="20" value="10" required
                            placeholder=" ">
                        <i class="fa-solid fa-list-check"></i>
                        <label for="mcqCount" class="form-label">MCQs</label>
                    </div>

                    <!-- Coding Count -->
                    <div class="form-group">
                        <input type="number" id="codingCount" class="form-control" min="0" max="5" value="2" required
                            placeholder=" ">
                        <i class="fa-solid fa-code"></i>
                        <label for="codingCount" class="form-label">Coding</label>
                    </div>

                    <!-- Duration -->
                    <div class="form-group">
                        <input type="number" id="duration" class="form-control" min="15" max="180" value="60" required
                            placeholder=" ">
                        <i class="fa-regular fa-clock"></i>
                        <label for="duration" class="form-label">Duration</label>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-generate">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Generate Assessment</span>
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Specific logic for this page
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('assessmentForm');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = e.target.querySelector('button');
                    // ... rest of the code

                    const originalContent = btn.innerHTML;

                    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Generating...</span>';
                    btn.disabled = true;

                    const data = {
                        job_description: document.getElementById('jobDescription').value,
                        required_skills: document.getElementById('requiredSkills').value,
                        mcq_count: document.getElementById('mcqCount').value,
                        coding_count: document.getElementById('codingCount').value,
                        duration: document.getElementById('duration').value
                    };

                    try {
                        const response = await fetch('http://localhost:8001/api/ai/generate/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(data)
                        });

                        if (response.ok) {
                            const result = await response.json();
                            alert('Assessment Generated Successfully! Redirecting to assessments list...');
                            window.location.href = 'assessments.html';
                        } else {
                            alert('Failed to generate assessment. Please try again.');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('An error occurred. Is the backend running?');
                    } finally {
                        btn.innerHTML = originalContent;
                        btn.disabled = false;
                    }
                });
            }
        });
    </script>
</body>

</html>
