<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Interview | VeriFiHireAI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .start-card {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        h1 {
            color: #2d3748;
            margin-bottom: 1rem;
        }

        p {
            color: #718096;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }

        .start-btn:hover {
            transform: translateY(-2px);
        }

        .loader {
            display: none;
            margin-top: 1rem;
            color: #667eea;
        }
    </style>
</head>

<body>
    <div class="start-card" id="content">
        <div class="icon-circle">
            <i class="fa-solid fa-microphone-lines"></i>
        </div>
        <h1 id="greeting">Welcome!</h1>
        <p id="subtext">Please upload your resume to begin the AI-powered video interview.</p>

        <!-- Candidate Info Display -->
        <div id="candidateInfo"
            style="display: none; background: #f8f9fa; padding: 1rem; border-radius: 12px; margin-bottom: 2rem; text-align: left;">
            <p style="margin: 0; color: #2d3748; font-weight: 600;"><i class="fa-regular fa-user"
                    style="margin-right: 8px; color: #667eea;"></i> <span id="candidateNameDisplay"></span></p>
            <p style="margin: 0.5rem 0 0 0; color: #718096; font-size: 0.9rem;"><i class="fa-regular fa-envelope"
                    style="margin-right: 8px; color: #667eea;"></i> <span id="candidateEmailDisplay"></span></p>
        </div>

        <!-- Resume Upload (Hidden if already exists, but we ask for it again to be safe or update) -->
        <div id="resumeUploadSection" style="margin-bottom: 2rem; display: none;">
            <div class="enhanced-upload-zone" id="resumeDropZone"
                style="border: 2px dashed #cbd5e0; border-radius: 12px; padding: 2rem; cursor: pointer; transition: all 0.2s;">
                <input type="file" id="candidateResume" name="candidateResume" accept=".pdf,.doc,.docx" hidden>
                <i class="fa-solid fa-cloud-arrow-up" style="font-size: 2rem; color: #667eea; margin-bottom: 1rem;"></i>
                <p style="margin: 0 0 0.5rem 0; font-weight: 600; color: #4a5568;">Upload Resume</p>
                <p style="margin: 0; font-size: 0.85rem; color: #a0aec0;" id="fileNameDisplay">Drag & drop or Click to
                    browse</p>
            </div>
        </div>

        <button class="start-btn" onclick="startInterview()" id="startBtn" disabled>
            Start Interview Now
        </button>

        <div class="loader" id="loader">
            <i class="fa-solid fa-spinner fa-spin"></i> <span id="loaderText">Verifying candidate...</span>
        </div>
        <div id="errorMessage" style="color: #e53e3e; margin-top: 1rem; display: none;"></div>
    </div>

    <!-- Upload Zone Styles -->
    <style>
        .enhanced-upload-zone:hover {
            border-color: #667eea !important;
            background: #f0f4ff;
        }

        .file-selected-style {
            background: #e6fffa;
            border-color: #38b2ac !important;
            color: #2c7a7b;
        }
    </style>

    <script>
        let candidateId = null;
        let jobDescription = null; // Will be fetched from candidate record
        let resumeFile = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const loader = document.getElementById('loader');
            const content = document.getElementById('content');
            const startBtn = document.getElementById('startBtn');
            const candidateInfo = document.getElementById('candidateInfo');
            const resumeUploadSection = document.getElementById('resumeUploadSection');

            // Initial State: Loading
            loader.style.display = 'block';
            startBtn.style.display = 'none';

            if (token) {
                // FETCH CANDIDATE FROM BACKEND
                try {
                    const response = await fetch(`http://127.0.0.1:8001/api/ai-candidates/${token}/`);
                    if (!response.ok) throw new Error('Candidate not found');

                    const candidate = await response.json();

                    candidateId = candidate.id;
                    jobDescription = candidate.job_description; // Store JD for matching

                    document.getElementById('greeting').textContent = `Welcome, ${candidate.full_name.split(' ')[0]}!`;
                    document.getElementById('candidateNameDisplay').textContent = candidate.full_name;
                    document.getElementById('candidateEmailDisplay').textContent = candidate.email;

                    candidateInfo.style.display = 'block';
                    resumeUploadSection.style.display = 'block';

                    loader.style.display = 'none';
                    startBtn.style.display = 'block';
                } catch (error) {
                    console.error('Error fetching candidate:', error);
                    loader.style.display = 'none';
                    document.getElementById('errorMessage').textContent = 'Invalid or expired interview link.';
                    document.getElementById('errorMessage').style.display = 'block';
                }
            } else {
                // FALLBACK: LocalStorage Simulation (for simple testing without backend)
                const rawData = localStorage.getItem('pendingInterview');
                if (rawData) {
                    const data = JSON.parse(rawData);
                    document.getElementById('greeting').textContent = `Welcome, ${data.name.split(' ')[0]}!`;
                    document.getElementById('subtext').textContent = "Simulated Session";
                    startBtn.disabled = false;
                    startBtn.style.display = 'block';
                    loader.style.display = 'none';
                    candidateId = 'simulate'; // Marker
                } else {
                    loader.style.display = 'none';
                    document.getElementById('errorMessage').textContent = 'No interview session found.';
                    document.getElementById('errorMessage').style.display = 'block';
                }
            }
        });

        // Resume Upload UI Logic
        const dropZone = document.getElementById('resumeDropZone');
        const fileInput = document.getElementById('candidateResume');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const startBtn = document.getElementById('startBtn');

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#667eea';
            dropZone.style.background = '#f0f4ff';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#cbd5e0';
            dropZone.style.background = 'transparent';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (file && (file.type.includes('pdf') || file.type.includes('word') || file.name.endsWith('.docx'))) {
                resumeFile = file;
                fileNameDisplay.textContent = `Selected: ${file.name}`;
                dropZone.classList.add('file-selected-style');
                startBtn.disabled = false; // Enable start button
            } else {
                alert('Please upload a valid PDF or Word document.');
            }
        }

        async function startInterview() {
            const btn = document.getElementById('startBtn');
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loaderText');

            if (!resumeFile && candidateId !== 'simulate' && !confirm("No new resume selected. Use existing resume if available?")) {
                return;
            }

            btn.style.display = 'none';
            loader.style.display = 'block';
            loaderText.textContent = "Analyzing resume & generating questions...";

            // simulation path
            if (candidateId === 'simulate') {
                setTimeout(() => {
                    window.location.href = 'ai_interview_session.html';
                }, 1500);
                return;
            }

            try {
                // SUBMIT TO MATCHING ENDPOINT
                const formData = new FormData();
                if (resumeFile) {
                    formData.append('resume', resumeFile);
                }
                formData.append('candidate_id', candidateId);
                // We don't need to append job_description as backend fetches it from candidate

                const response = await fetch('http://127.0.0.1:8001/api/ai-candidates/match/', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'Failed to start session');
                }

                const data = await response.json();

                // STORE SESSION DATA
                // ensure we have the questions
                if (!data.interview_questions) {
                    throw new Error('No questions generated');
                }

                const sessionData = {
                    candidateId: candidateId,
                    candidateName: document.getElementById('candidateNameDisplay').textContent,
                    questions: data.interview_questions,
                    status: 'interview_started'
                };

                sessionStorage.setItem('interviewData', JSON.stringify(sessionData));

                // Redirect
                window.location.href = 'ai_interview_session.html';

            } catch (error) {
                console.error('Error starting interview:', error);
                loader.style.display = 'none';
                btn.style.display = 'block';
                document.getElementById('errorMessage').textContent = `Error: ${error.message}`;
                document.getElementById('errorMessage').style.display = 'block';
            }
        }
    </script>
</body>

</html>
