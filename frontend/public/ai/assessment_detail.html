<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Details | VerifiHireAI</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #a855f7;
            --accent: #f43f5e;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: var(--shadow-xl);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 3rem;
        }

        .header-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateX(-4px);
        }

        /* Overview Grid */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .overview-item {
            background: rgba(255, 255, 255, 0.5);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .overview-item label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .overview-item p {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Section Headings */
        .section-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid rgba(99, 102, 241, 0.1);
        }

        .section-header i {
            color: var(--primary);
            font-size: 1.25rem;
        }

        .section-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Question Cards */
        .question-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e2e8f0;
            transition: transform 0.3s ease;
        }

        .question-card:hover {
            transform: scale(1.01);
            box-shadow: var(--shadow-sm);
        }

        .question-num {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 1.25rem;
        }

        .option-list {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .option-item {
            padding: 0.75rem 1rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .option-item.correct {
            background: #f0fdf4;
            border-color: #22c55e;
            color: #15803d;
            font-weight: 600;
        }

        .option-item i {
            font-size: 1rem;
        }

        /* Coding Section */
        .coding-card {
            background: #0f172a;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            color: #f8fafc;
        }

        .coding-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 1rem;
        }

        .coding-problem {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #cbd5e1;
            margin-bottom: 1.5rem;
        }

        .coding-example-label {
            font-size: 0.8rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .code-block {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.25rem;
            border-radius: 12px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        .loading-state {
            text-align: center;
            padding: 4rem;
        }

        .loading-state i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .error-state {
            text-align: center;
            padding: 4rem;
            color: var(--accent);
        }

        @media (max-width: 768px) {
            .overview-grid {
                grid-template-columns: 1fr;
            }

            .option-list {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <!-- Loading State -->
            <div id="loading" class="loading-state">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <h2>Loading Assessment...</h2>
            </div>

            <!-- Content (Hidden initially) -->
            <div id="content" style="display: none;">
                <div class="header">
                    <div class="header-title">
                        <h1 id="pageTitle">Assessment Details</h1>
                        <p id="assessmentDate">Created on: ...</p>
                    </div>
                    <a href="assessments.html" class="btn-back">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back to List</span>
                    </a>
                </div>

                <div class="overview-grid">
                    <div class="overview-item">
                        <label>Job Description</label>
                        <p id="jobRole"></p>
                    </div>
                    <div class="overview-item">
                        <label>Required Skills</label>
                        <p id="skills"></p>
                    </div>
                    <div class="overview-item">
                        <label>Duration</label>
                        <p id="duration"></p>
                    </div>
                </div>

                <!-- MCQs -->
                <div class="section-header">
                    <i class="fa-solid fa-list-check"></i>
                    <h2>Multiple Choice Questions</h2>
                </div>
                <div id="mcqContainer"></div>

                <!-- Coding -->
                <div class="section-header" style="margin-top: 3rem;">
                    <i class="fa-solid fa-code"></i>
                    <h2>Coding Challenges</h2>
                </div>
                <div id="codingContainer"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                alert('No assessment ID provided.');
                window.location.href = 'assessments.html';
                return;
            }

            try {
                // FIXED URL: added /ai/
                const response = await fetch(`http://localhost:8001/api/ai/${id}/`);
                if (!response.ok) throw new Error('Failed to fetch details');

                const data = await response.json();

                // Switch states
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                renderAssessment(data);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="error-state">
                        <i class="fa-solid fa-circle-exclamation" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <h2>Failed to Load</h2>
                        <p>${error.message}</p>
                        <a href="assessments.html" class="btn-back" style="margin-top: 2rem; display: inline-flex;">Try Again</a>
                    </div>
                `;
            }
        });

        function renderAssessment(data) {
            // Meta info
            const date = new Date(data.created_at);
            document.getElementById('assessmentDate').textContent = `Created on: ${date.toLocaleDateString()} at ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

            document.getElementById('jobRole').textContent = data.job_description;

            document.title = `${data.job_description.split(' ')[0]} Assessment | VerifiHireAI`;

            document.getElementById('skills').textContent = data.required_skills;
            document.getElementById('duration').textContent = `${data.duration_minutes} Minutes`;

            const content = data.generated_content;
            if (!content) {
                document.getElementById('mcqContainer').innerHTML = '<p>No content generated.</p>';
                return;
            }

            // MCQs
            const mcqContainer = document.getElementById('mcqContainer');
            mcqContainer.innerHTML = '';
            if (content.mcqs) {
                content.mcqs.forEach((q, index) => {
                    const card = document.createElement('div');
                    card.className = 'question-card';

                    let optionsHtml = '';
                    q.options.forEach(opt => {
                        const isCorrect = opt === q.answer;
                        optionsHtml += `
                            <div class="option-item ${isCorrect ? 'correct' : ''}">
                                <i class="fa-solid ${isCorrect ? 'fa-circle-check' : 'fa-circle'}"></i>
                                <span>${opt}</span>
                            </div>`;
                    });

                    card.innerHTML = `
                        <div class="question-num">Question ${index + 1}</div>
                        <div class="question-text">${q.question}</div>
                        <div class="option-list">${optionsHtml}</div>
                    `;
                    mcqContainer.appendChild(card);
                });
            }

            // Coding
            const codingContainer = document.getElementById('codingContainer');
            codingContainer.innerHTML = '';
            if (content.coding_challenges) {
                content.coding_challenges.forEach((c, index) => {
                    const card = document.createElement('div');
                    card.className = 'coding-card';
                    card.innerHTML = `
                        <div class="coding-title">${index + 1}. ${c.title}</div>
                        <div class="coding-problem">${c.problem}</div>
                        <div class="coding-example-label">Example Pattern</div>
                        <div class="code-block">${c.example || 'N/A'}</div>
                    `;
                    codingContainer.appendChild(card);
                });
            }
        }
    </script>
</body>

</html>
