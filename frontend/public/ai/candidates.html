<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidates | VeriFiHireAI</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="dashboard-page">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="logo">VeriFiHireAI</div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="ai_adventure.html"><i class="fa-solid fa-robot"></i> AI Adventure</a></li>
                <li class="active"><a href="#"><i class="fa-solid fa-users"></i> Candidates</a></li>
                <li><a href="assessments.html"><i class="fa-solid fa-clipboard-list"></i> Assessments</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h1>Candidates</h1>
                    <p>Manage and track all job applicants.</p>
                </div>
                <div class="user-profile">
                    <div class="notification-icon"><i class="fa-regular fa-bell"></i></div>
                    <div class="avatar">HR</div>
                </div>
            </header>

            <div class="dashboard-container">
                <section class="recent-section">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h2 class="section-heading" style="margin-bottom: 0;">All Applicants</h2>
                        <div class="filter-controls">
                            <select id="statusFilter" class="auth-input-with-icon"
                                style="padding: 0.5rem 2rem 0.5rem 1rem; width: auto; margin: 0;">
                                <option value="All">All Candidates</option>
                                <option value="New">New</option>
                                <option value="Resume Passed">Resume Passed</option>
                                <option value="Resume Failed">Resume Failed</option>
                                <option value="Review">In Review</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="data-table" id="candidatesTable">
                            <thead>
                                <tr>
                                    <th>Candidate Name</th>
                                    <th>Role / Title</th>
                                    <th>Email</th>
                                    <th>Applied Date</th>
                                    <th>Resume</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Rows will be populated by JS -->
                            </tbody>
                        </table>
                        <div id="noDataMessage"
                            style="text-align: center; padding: 2rem; color: var(--text-secondary); display: none;">
                            No candidates found. <a href="index.html"
                                style="color: var(--blue-accent); font-weight: 600;">Add one now</a>.
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.querySelector('#candidatesTable tbody');
            const noDataMsg = document.getElementById('noDataMessage');

            fetch('http://localhost:8001/api/ai-candidates/')
                .then(response => response.json())
                .then(candidates => {
                    const filterSelect = document.getElementById('statusFilter');

                    function renderTable(data) {
                        tableBody.innerHTML = '';
                        if (data.length === 0) {
                            noDataMsg.style.display = 'block';
                            return;
                        }
                        noDataMsg.style.display = 'none';

                        data.forEach(candidate => {
                            const row = document.createElement('tr');

                            // Get initials
                            const initials = candidate.full_name
                                .split(' ')
                                .map(n => n[0])
                                .join('')
                                .toUpperCase()
                                .slice(0, 2);

                            // Format Date
                            const dateObj = new Date(candidate.submission_date);
                            const dateStr = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

                            row.innerHTML = `
                            <td>
                                <div class="candidate-info">
                                    <div class="candidate-avatar">${initials}</div>
                                    <span>${candidate.full_name}</span>
                                </div>
                            </td>
                            <td>${candidate.job_title}</td>
                            <td>${candidate.email}</td>
                            <td>${dateStr}</td>
                            <td>
                                ${candidate.resume ?
                                    `<a href="${candidate.resume}" target="_blank" style="color: var(--blue-accent); text-decoration: none;">
                                        <i class="fa-solid fa-paperclip"></i> View Resume
                                    </a>` :
                                    '<span style="color: grey;">No Resume</span>'
                                }
                            </td>
                            <td>
                                    <a href="resume_matcher.html?id=${candidate.id}" class="action-btn" style="text-decoration: none; display: inline-block;">
                                        ${candidate.status === 'Resume Passed' || candidate.status === 'Resume Failed' ? 'Re-Analyze' : 'Analyze'}
                                    </a>
                                </td>
                            `;
                            tableBody.appendChild(row);
                        });
                    }

                    // Initial Render
                    renderTable(candidates);

                    // Filter Logic
                    filterSelect.addEventListener('change', (e) => {
                        const status = e.target.value;
                        if (status === 'All') {
                            renderTable(candidates);
                        } else {
                            const filtered = candidates.filter(c => c.status === status);
                            renderTable(filtered);
                        }
                    });
                })
                .catch(error => {
                    console.error('Error fetching candidates:', error);
                    noDataMsg.innerHTML = 'Error loading data. Verify backend is running.';
                    noDataMsg.style.display = 'block';
                    noDataMsg.style.color = 'red';
                });
        });
    </script>
</body>

</html>
