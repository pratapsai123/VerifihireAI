<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Matcher | VeriFiHireAI</title>
    <link rel="stylesheet" href="styles.css?v=1.0">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Inherit or replicate key styles from ai_interview.html for consistency */

        .matcher-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .matcher-hero {
            background: linear-gradient(135deg, #4318FF 0%, #764ba2 100%);
            border-radius: 24px;
            padding: 3rem;
            margin-bottom: 2rem;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(67, 24, 255, 0.2);
        }

        .matcher-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(60px);
        }

        .matcher-hero h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
            color: white;
        }

        .matcher-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
            color: rgba(255, 255, 255, 0.9);
        }

        .main-card {
            background: white;
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(112, 144, 176, 0.1);
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--navy-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title i {
            color: var(--blue-accent);
            background: var(--indigo-50);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 1.1rem;
        }

        .enhanced-drop-zone {
            border: 2px dashed #E0E5F2;
            border-radius: 16px;
            background: #F8F9FF;
            padding: 2.5rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .enhanced-drop-zone:hover,
        .enhanced-drop-zone.dragover {
            border-color: var(--blue-accent);
            background: #EEF2FF;
            transform: translateY(-2px);
        }

        .enhanced-textarea {
            width: 100%;
            min-height: 150px;
            padding: 1.25rem;
            border: 1px solid #E0E5F2;
            border-radius: 16px;
            background: #F8F9FF;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--navy-secondary);
            resize: vertical;
            transition: all 0.3s ease;
        }

        .enhanced-textarea:focus {
            outline: none;
            border-color: var(--blue-accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.05);
        }

        /* Result Styles Override */
        .result-container {
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <div class="dashboard-page" style="justify-content: center;">
        <!-- Sidebar Removed -->

        <!-- Main Content -->
        <main class="main-content" style="margin-left: 0; width: 100%; max-width: 1200px;">
            <header class="top-bar">
                <div class="page-title">
                    <!-- Clean minimal header since we have Hero now -->
                </div>
                <div class="user-profile">
                    <div class="notification-icon"><i class="fa-regular fa-bell"></i></div>
                    <div class="avatar">HR</div>
                </div>
            </header>

            <div class="matcher-container">
                <!-- Hero Section -->
                <div class="matcher-hero">
                    <h1>Resume Matcher</h1>
                    <p>AI-powered side-by-side analysis of candidate fit.</p>
                </div>

                <!-- Input Section -->
                <div id="inputSection">
                    <div class="main-card">
                        <!-- Step 1: Upload -->
                        <div style="margin-bottom: 2.5rem;">
                            <h3 class="section-title"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Candidates</h3>
                            <div class="enhanced-drop-zone" id="dropZone">
                                <i class="fa-solid fa-file-pdf"
                                    style="font-size: 3rem; color: var(--blue-accent); margin-bottom: 1rem;"></i>
                                <h4 style="margin: 0 0 0.5rem 0; color: var(--navy-secondary);">Drag & Drop Resumes Here
                                </h4>
                                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0;">or <span
                                        style="color: var(--blue-accent); font-weight: 600; text-decoration: underline;">browse
                                        files</span> from your computer</p>
                                <input type="file" id="resumeFile" accept=".pdf" multiple style="display: none;">
                                <div id="fileName" class="file-name" style="display: none; margin-top: 1rem;"></div>
                            </div>
                        </div>

                        <!-- Step 2: Job Description -->
                        <div style="margin-bottom: 2.5rem;">
                            <h3 class="section-title"><i class="fa-solid fa-briefcase"></i> Job Description</h3>
                            <textarea id="jobDesc" class="enhanced-textarea"
                                placeholder="Paste the job requirements, responsibilities, and qualifications here..."></textarea>
                        </div>

                        <!-- Step 3: Settings -->
                        <div>
                            <div
                                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                                <h3 class="section-title" style="margin-bottom: 0;"><i class="fa-solid fa-sliders"></i>
                                    Match Threshold</h3>
                                <span id="thresholdValue"
                                    style="font-size: 1.1rem; font-weight: 700; color: var(--blue-accent); background: var(--indigo-50); padding: 0.25rem 0.75rem; border-radius: 8px;">70%</span>
                            </div>
                            <input type="range" id="thresholdRange" min="0" max="100" value="70"
                                style="width: 100%; accent-color: var(--blue-accent); cursor: pointer; height: 6px; background: #E0E5F2; border-radius: 5px;">
                            <div
                                style="display: flex; justify-content: space-between; margin-top: 0.5rem; color: var(--text-secondary); font-size: 0.8rem;">
                                <span>Lenient (0%)</span>
                                <span>Strict (100%)</span>
                            </div>
                        </div>
                    </div>

                    <!-- Action -->
                    <div class="matcher-actions">
                        <button class="auth-primary-btn" id="matchBtn"
                            style="width: 100%; justify-content: center; padding: 1.25rem;">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Analyze Candidate Fit
                        </button>
                    </div>
                </div>

                <!-- Result Section (Dynamic) -->
                <div class="result-container" id="resultSection" style="display: none;">
                    <!-- Content will be injected by matcher.js -->
                </div>
            </div>
        </main>
    </div>

    <script src="matcher.js"></script>
</body>

</html>
