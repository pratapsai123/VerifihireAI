# ===============================
# HTTP → HTTPS + CERTBOT
# ===============================
server {
    listen 80;
    server_name verifihireai.com www.verifihireai.com;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
        try_files $uri =404;
    }

    # Redirect everything to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===============================
# HTTPS SERVER
# ===============================
server {
    listen 443 ssl;
    server_name verifihireai.com www.verifihireai.com;

    ssl_certificate /etc/letsencrypt/live/verifihireai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verifihireai.com/privkey.pem;

    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;


    # ===============================
    # DEEPFACE SERVICE
    # ===============================
    location /deepface/ {
    proxy_pass http://host.docker.internal:8500/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300;
    proxy_connect_timeout 300;

    proxy_redirect off;
}

    # ===============================
    # BACKEND API (Django)
    # ===============================
    location /api/ {
        proxy_pass http://host.docker.internal:8001;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_redirect off;
    }


    # ===============================
    # WEBSOCKETS
    # ===============================
    location /ws/ {
        proxy_pass http://host.docker.internal:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }


    # ===============================
    # ADMIN (STATIC)
    # ===============================
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        alias /usr/share/nginx/admin/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }


    # ===============================
    # FRONTEND (React)
    # ===============================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /static/ {
        root /usr/share/nginx/html;
    }


    # ===============================
    # MEDIA
    # ===============================
    location /media/ {
        alias /app/media/;
    }
}