# ===============================
# HTTP → HTTPS REDIRECT + CERTBOT
# ===============================
server {
    listen 80;
    server_name verifihireai.com www.verifihireai.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===============================
# HTTPS SERVER (MAIN)
# ===============================
server {
    listen 443 ssl;
    server_name verifihireai.com www.verifihireai.com;

    ssl_certificate /etc/letsencrypt/live/verifihireai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verifihireai.com/privkey.pem;

    client_max_body_size 10M;

    # ===============================
    # FRONTEND (React - Production Build)
    # ===============================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Static files (React build)
    location /static/ {
        root /usr/share/nginx/html;
    }

    # ===============================
    # BACKEND API (Django)
    # ===============================
    location /api/ {
        proxy_pass http://172.24.16.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===============================
    # REACT ADMIN PORTAL (if used)
    # ===============================
    location /admin/ {
        proxy_pass http://172.24.16.1:3001/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===============================
    # DJANGO ADMIN (BACKEND)
    # ===============================
    location /django-admin/ {
        proxy_pass http://172.24.16.1:8001/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static (admin)
    location /django-static/ {
        alias /app/staticfiles/;
    }

    # ===============================
    # WEBSOCKETS (Django Channels)
    # ===============================
    location /ws {
        proxy_pass http://172.24.16.1:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    location /ws/ {
        proxy_pass http://172.24.16.1:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    # ===============================
    # MEDIA FILES (Django uploads)
    # ===============================
    location /media/ {
        alias /app/media/;
    }

    # ===============================
    # ERROR HANDLING
    # ===============================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}